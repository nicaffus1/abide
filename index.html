function prayer(){let list=s.prayers.filter(x=>x.status===prayerTab);$("main").innerHTML="<section class=\"sanctuary\" aria-label=\"Prayer sanctuary\"><svg viewBox=\"0 0 360 150\" aria-hidden=\"true\"><defs><radialGradient id=\"fireglow\"><stop stop-color=\"#f5bc68\" stop-opacity=\".65\"/><stop offset=\"1\" stop-color=\"#f5bc68\" stop-opacity=\"0\"/></radialGradient><linearGradient id=\"stone\" x2=\".3\" y2=\"1\"><stop stop-color=\"#8d7356\"/><stop offset=\"1\" stop-color=\"#3d3026\"/></linearGradient><linearGradient id=\"fire\" x1=\"0\" y1=\"1\" x2=\"0\" y2=\"0\"><stop stop-color=\"#df7935\"/><stop offset=\".55\" stop-color=\"#ffcf75\"/><stop offset=\"1\" stop-color=\"#fff1bf\"/></linearGradient></defs><ellipse class=\"halo\" cx=\"180\" cy=\"65\" rx=\"110\" ry=\"70\" fill=\"url(#fireglow)\"/><path d=\"M20 131 90 121 138 127 220 125 290 119 340 133\" stroke=\"#806041\" opacity=\".35\" fill=\"none\"/><g fill=\"url(#stone)\" stroke=\"#36291f\" stroke-width=\"2\"><path d=\"m111 111 35-9 33 8 33-7 38 9 12 27-161 0z\"/><path d=\"m120 85 29-7 35 5 33-7 27 12 8 24-143-1z\"/><path d=\"m135 74 30-6 38 2 25 9-10 12-79-3z\"/><path d=\"m146 104-2 32m43-28 4 29m35-30 4 29m-68-57-6 24m48-21 4 24\" fill=\"none\" opacity=\".7\"/></g><path d=\"M157 77q23 7 46 0l-7 7h-32z\" fill=\"#b28950\"/><g class=\"flame\"><path d=\"M180 77c-23-10-11-24 3-48-3 18 17 24 8 39-2 5-6 8-11 9z\" fill=\"url(#fire)\"/><path d=\"M180 75c-8-6-5-13 2-24-1 10 7 15-2 24z\" fill=\"#fff4ce\"/></g><path d=\"M180 25q-12-10-3-20\" stroke=\"#e9cda2\" stroke-width=\"1.2\" opacity=\".25\" fill=\"none\"/></svg><h1>In His Presence</h1><p>Let my prayer be set forth before thee as incense.</p><small>PSALM 141:2 · KJV</small></section>"+'<div class="prayer-stats"><div><b>'+s.prayers.filter(x=>x.status==="active").length+'</b><small>Active requests</small></div><div><b>'+s.prayers.filter(x=>[...(x.log||[]),x.last||0].some(t=>t&&new Date(t).toDateString()===new Date().toDateString())).length+'</b><small>Prayed for today</small></div><div><b>'+s.prayers.filter(x=>x.status==="answered").length+'</b><small>Answered</small></div></div><button class="primary add-request" onclick="editPrayer()">+ Add prayer request</button><div class="prayer-heading"><h2 class="section-label">Prayer requests</h2><small>Before the Lord</small></div><div class="tabs">'+["active","answered","archived"].map(t=>'<button class="'+(t===prayerTab?"on":"")+'" onclick="prayerTab=\''+t+'\';prayer()">'+({active:"Active",answered:"Answered",archived:"Archived"}[t])+' ('+s.prayers.filter(x=>x.status===t).length+')</button>').join("")+'</div>'+ (list.map(p=>'<div class="card"><div class="row spread"><b>'+esc(p.title)+'</b>'+(p.status==="active"?'<button data-pray="'+p.id+'" '+(Date.now()-(p.last||0)<3600000?'disabled':'')+' onclick="pray(\''+p.id+'\')">'+(Date.now()-(p.last||0)<3600000?'✓ Prayed':'Pray')+'</button>':'')+'</div><details><summary class="muted">Details · '+esc(p.category||"General")+'</summary><p class="notes">'+esc(p.notes)+'</p><small>Added '+date(p.created)+' · Prayed '+(p.count||0)+' times</small>'+(p.answer?'<p><b>Answer:</b> '+esc(p.answer)+'</p>':'')+'<div class="row"><button onclick="editPrayer(\''+p.id+'\')">Edit</button>'+(p.status==="active"?'<button onclick="answer(\''+p.id+'\')">Answered</button><button onclick="statusPrayer(\''+p.id+'\',\'archived\')">Archive</button>':'<button onclick="statusPrayer(\''+p.id+'\',\'active\')">Restore</button>')+'</div></details></div>').join("")||'<div class="card muted">No requests here yet.</div>')+'<p class="muted prayer-footer">Each prayer button becomes available again after one hour.</p>'}function editPrayer(id){let p=s.prayers.find(x=>x.id===id)||{};modal(id?"Edit request":"New request",field("Person or request","pt",p.title)+field("Category","pc",p.category)+field("Prayer details / updates","pn",p.notes,true)+'<button class="primary" onclick="savePrayer(\''+(id||"")+'\')">Save request</button>')}function savePrayer(id){let title=$("pt").value.trim();if(!title)return;let p=s.prayers.find(x=>x.id===id);if(!p){p={id:uid(),created:Date.now(),status:"active",count:0};s.prayers.unshift(p)}Object.assign(p,{title,category:$("pc").value,notes:$("pn").value});close()}function pray(id){let p=s.prayers.find(x=>x.id===id);if(Date.now()-(p.last||0)<3600000)return;p.last=Date.now();p.count=(p.count||0)+1;(p.log??=[]).push(p.last);save();prayer()}function statusPrayer(id,status){s.prayers.find(x=>x.id===id).status=status;save();prayer()}function answer(id){modal("Record answered prayer",field("How was it answered?","pa","",true)+'<button class="primary" onclick="let p=s.prayers.find(x=>x.id===\''+id+'\');p.answer=$(&quot;pa&quot;).value;p.status=\'answered\';p.answeredAt=Date.now();close()">Save answer</button>')}
function journal(){let list=s.journal.filter(x=>(!journalFilter||x.category===journalFilter));$("main").innerHTML='<div class="eyebrow">Remember His works</div><div class="row spread"><h1>Journal</h1><button class="primary" onclick="editJournal()">+ Entry</button></div><select onchange="journalFilter=this.value;journal()"><option value="">All categories</option>'+options(s.categories,journalFilter)+'</select><input placeholder="Search entries" oninput="filterCards(this.value)"><div id="entries">'+(list.map(j=>'<div class="card entry"><small>'+esc(j.category)+' · '+date(j.created)+'</small><h2>'+esc(j.title)+'</h2><small>'+esc(j.scripture)+'</small><p class="notes">'+esc(j.notes)+'</p><button onclick="editJournal(\''+j.id+'\')">Edit</button></div>').join("")||'<div class="card muted">Start recording your faith journey.</div>')+'</div>'}function filterCards(q){document.querySelectorAll(".entry").forEach(e=>e.hidden=!e.textContent.toLowerCase().includes(q.toLowerCase()))}function editJournal(id){let j=s.journal.find(x=>x.id===id)||{};modal("Journal entry",field("Title","jt",j.title)+'<label>Category<select id="jc">'+options(s.categories,j.category)+'</select></label>'+field("Scripture / tags","js",j.scripture)+field("Reflection","jn",j.notes,true)+'<button class="primary" onclick="saveJournal(\''+(id||"")+'\')">Save entry</button>'+(id?'<button class="danger" onclick="remove(\'journal\',\''+id+'\')">Delete</button>':''))}function saveJournal(id){let title=$("jt").value.trim();if(!title)return;let j=s.journal.find(x=>x.id===id);if(!j){j={id:uid(),created:Date.now()};s.journal.unshift(j)}Object.assign(j,{title,category:$("jc").value,scripture:$("js").value,notes:$("jn").value});close()}function remove(group,id){if(confirm("Delete this permanently?")){s[group]=s[group].filter(x=>x.id!==id);close()}}
const templates=["I was thinking of you today and wanted to encourage you. May the Lord strengthen you and give you peace in whatever you face. (Isaiah 41:10)","Just a reminder that your labor in the Lord is not in vain. Keep looking to Christ. (1 Corinthians 15:58)","Praying that God gives you wisdom, endurance, and joy today. You are not forgotten. (James 1:5)","I appreciate you and wanted to remind you of the Lord’s steadfast love and faithfulness. (Lamentations 3:22–23)","May the God of hope fill you with joy and peace as you trust in Him. (Romans 15:13)"];function randomPerson(){if(!s.people.length)return;let pool=s.people.filter(p=>p.id!==chosen);if(!pool.length)pool=s.people;pool.sort((a,b)=>(a.last||0)-(b.last||0));chosen=pool[Math.floor(Math.random()*Math.max(1,Math.ceil(pool.length/2)))].id;generate()}function generate(){let p=s.people.find(x=>x.id===chosen);let old=draft;do{draft=(p?"Hey "+p.name.split(" ")[0]+"! ":"")+templates[Math.floor(Math.random()*templates.length)]}while(draft===old);encourage()}function encourage(){let p=s.people.find(x=>x.id===chosen);$("main").innerHTML='<div class="eyebrow">Build one another up</div><h1>Encourage</h1><div class="card"><small>Someone to encourage</small><h2>'+esc(p?.name||"Choose a person")+'</h2><button onclick="randomPerson()">Shuffle person</button><select onchange="chosen=this.value;generate()"><option value="">Choose contact</option>'+s.people.map(x=>'<option value="'+x.id+'" '+(x.id===chosen?'selected':'')+'>'+esc(x.name)+'</option>').join("")+'</select><textarea id="msg" oninput="draft=this.value" placeholder="Write or generate a message">'+esc(draft)+'</textarea><div class="row"><button onclick="generate()">Generate message</button><button class="primary" '+(!p?'disabled':'')+' onclick="sendText()">Open Messages</button></div><small>Review and send in Messages. Mark sent here afterward.</small>'+(p?'<p><button onclick="sent()">Mark as sent</button></p>':'')+'</div><div class="row spread"><h2>People</h2><button onclick="editPerson()">+ Person</button></div>'+s.people.map(x=>'<div class="card row spread"><div><b>'+esc(x.name)+'</b><br><small>'+ (x.last?'Last encouraged '+date(x.last):'Not yet encouraged')+'</small></div><button onclick="editPerson(\''+x.id+'\')">Edit</button></div>').join("")+'<details class="card"><summary>Encouragement history</summary>'+s.history.map(h=>'<p>'+esc(h.name)+' · '+date(h.time)+'<br>'+esc(h.message)+'</p>').join("")+'</details>'}function editPerson(id){let p=s.people.find(x=>x.id===id)||{};modal("Contact",field("Name","en",p.name)+field("Mobile number","ep",p.phone)+'<button class="primary" onclick="savePerson(\''+(id||"")+'\')">Save</button>'+(id?'<button class="danger" onclick="remove(\'people\',\''+id+'\')">Delete</button>':''))}function savePerson(id){let name=$("en").value.trim(),phone=$("ep").value.trim();if(!name||!phone)return;let p=s.people.find(x=>x.id===id);if(!p){p={id:uid()};s.people.push(p)}Object.assign(p,{name,phone});close()}function sendText(){let p=s.people.find(x=>x.id===chosen);if(!p||!draft.trim())return;location.href="sms:"+p.phone.replace(/[^+\d]/g,"")+( /iPhone|iPad|iPod/.test(navigator.userAgent)?"&":"?")+"body="+encodeURIComponent(draft)}function sent(){let p=s.people.find(x=>x.id===chosen);if(!p||!draft.trim())return;p.last=Date.now();s.history.unshift({name:p.name,time:p.last,message:draft});save();draft="";encourage()}
function devotional(){let list=s.devotions.filter(x=>devTab==="all"||x.status===devTab);$("main").innerHTML='<div class="eyebrow">Prepare to share the Word</div><div class="row spread"><h1>Devotional</h1><button class="primary" onclick="editDev()">+ Devotion</button></div><div class="tabs">'+["all","draft","upcoming","delivered"].map(t=>'<button class="'+(t===devTab?'on':'')+'" onclick="devTab=\''+t+'\';devotional()">'+t[0].toUpperCase()+t.slice(1)+'</button>').join("")+'</div><input placeholder="Search title, passage or notes" oninput="filterCards(this.value)">'+(list.map(d=>'<div class="card entry"><small>'+esc(d.status)+' · '+esc(d.when||"No date")+'</small><h2>'+esc(d.title)+'</h2><p>'+esc(d.scripture)+'</p><div hidden>'+esc(d.notes)+'</div><div class="row"><button class="primary" onclick="present(\''+d.id+'\')">Present</button><button onclick="editDev(\''+d.id+'\')">Edit</button><button onclick="duplicate(\''+d.id+'\')">Duplicate</button></div></div>').join("")||'<div class="card muted">Your Sunday morning devotionals will appear here.</div>')}function editDev(id){let d=s.devotions.find(x=>x.id===id)||{};modal("Devotional notes",field("Title","dt",d.title)+field("Scripture","ds",d.scripture)+'<label>Delivery date<input type="date" id="dd" value="'+esc(d.when)+'"></label><label>Status<select id="dst">'+options(["draft","upcoming","delivered"],d.status)+'</select></label>'+field("Introduction","di",d.intro,true)+field("Main points / outline","dn",d.notes,true)+field("Application / conclusion","da",d.application,true)+'<button class="primary" onclick="saveDev(\''+(id||"")+'\')">Save</button>'+(id?'<button class="danger" onclick="remove(\'devotions\',\''+id+'\')">Delete</button>':''))}function saveDev(id){let title=$("dt").value.trim();if(!title)return;let d=s.devotions.find(x=>x.id===id);if(!d){d={id:uid(),created:Date.now()};s.devotions.unshift(d)}Object.assign(d,{title,scripture:$("ds").value,when:$("dd").value,status:$("dst").value,intro:$("di").value,notes:$("dn").value,application:$("da").value});close()}function duplicate(id){let d=s.devotions.find(x=>x.id===id);s.devotions.unshift({...d,id:uid(),title:d.title+" (copy)",status:"draft"});save();devotional()}function present(id){let d=s.devotions.find(x=>x.id===id);modal(d.title,'<p>'+esc(d.scripture)+'</p>'+[["Introduction",d.intro],["Outline",d.notes],["Application",d.application]].map(([k,v])=>'<details open><summary>'+k+'</summary><p class="notes big">'+esc(v)+'</p></details>').join("")+'<button onclick="let p=s.devotions.find(x=>x.id===\''+id+'\');p.status=\'delivered\';close()">Mark delivered</button>')}
function settings(){modal("Settings",'<label>Atmosphere<select onchange="s.theme=this.value;save();theme()"><option value="system" '+(s.theme==="system"?"selected":"")+'>Candlelight (default)</option><option value="dark" '+(s.theme==="dark"?"selected":"")+'>Deep night</option><option value="light" '+(s.theme==="light"?"selected":"")+'>Warm daylight</option></select></label><hr><p class="muted">Your prayer requests and all previously saved faith data remain on this device. Export a backup regularly. Clearing website data can erase local records.</p><button onclick="backup()">Export all saved data</button><label>Restore backup<input type="file" accept="application/json" onchange="restore(this.files[0])"></label><button class="primary" onclick="close()">Done</button>')}function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:"application/json"}));a.download="abide-backup-"+day()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(f){if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.prayers)||!Array.isArray(d.journal)||!Array.isArray(d.people)||!Array.isArray(d.devotions)||!d.read||!d.seconds)throw Error();if(confirm("Replace local data with this backup?")){s={...defaults(),...d};close()}}catch{alert("Invalid backup file")}}render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
