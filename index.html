 {id:"vine",name:"Vineyard",symbol:"vine",cost:{seed:10,water:4}},
 {id:"bridge",name:"Stone bridge",symbol:"bridge",cost:{stone:12,water:3}},
 {id:"pond",name:"Pool of reflection",symbol:"pond",cost:{stone:5,water:8,seed:2}},
 {id:"fall",name:"Waterfall",symbol:"fall",cost:{stone:18,seed:5,water:15}},
 {id:"chamber",name:"Prayer chamber",symbol:"chamber",cost:{stone:24,water:6,oil:2}},
 {id:"memorial",name:"Memorial stone",symbol:"memorial",cost:{stone:4}}
];
let region=0,moveId=null,selectedCell=null;
function garden(){if(!s.garden||typeof s.garden!=="object")s.garden={};let g=s.garden;for(let k of ["tiles","thanks","reflections","sessions","landCosts"])if(!Array.isArray(g[k]))g[k]=[];if(!Number.isSafeInteger(g.land)||g.land<1)g.land=1;if(!["World","Prayer","Thanks","Journal","Memorial"].includes(g.tab))g.tab="World";return g}
function dateKey(t){let d=new Date(t);return Number.isFinite(d.getTime())?d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"):""}
function prayerDates(p){return [...new Set([...(Array.isArray(p.log)?p.log:[]),p.last].filter(t=>Number(t)>0).map(dateKey).filter(Boolean))]}
function allPrayerDays(){return new Set([...s.prayers.flatMap(prayerDates),...garden().sessions.map(x=>dateKey(x.at)).filter(Boolean)]).size}
function resources(){let g=garden(),b={stone:5+s.prayers.reduce((a,p)=>a+prayerDates(p).length,0),seed:4+g.thanks.length*2,water:2+g.reflections.length*2,oil:new Set(g.sessions.map(x=>dateKey(x.at)).filter(Boolean)).size};for(let cost of [...g.tiles.map(t=>t.spent||{}),...g.landCosts])for(let k of resourceKeys)b[k]-=Number(cost[k]||0);return b}
function costText(cost){return resourceKeys.filter(k=>cost[k]>0).map(k=>resourceGlyph[k]+" "+cost[k]+" "+resourceNames[k].toLowerCase()).join(" · ")||"Free"}
function affordable(cost){let b=resources();return resourceKeys.every(k=>b[k]>=(cost[k]||0))}
function resourceBar(){let b=resources();return '<div class="resources">'+resourceKeys.map(k=>'<div class="resource '+k+'"><span aria-hidden="true">'+resourceGlyph[k]+'</span><b>'+b[k]+'</b><small>'+resourceNames[k]+'</small></div>').join("")+'</div>'}
function navGarden(tab){let g=garden();g.tab=tab;moveId=null;save();render();window.scrollTo(0,0)}
function terrainName(n){if(n===0)return "Garden of Remembrance";let names=["Olive Valley","Desert Springs","Hill Country","River Garden","Vineyard Hills","Wilderness","Cedar Grove"];return names[(n-1)%names.length]+" "+(Math.floor((n-1)/names.length)+1)}
function tileArt(type,level=1){let art={
 altar:'<path d="M17 45 63 45 70 58H10Z" fill="#8b7355"/><path d="M22 35H58L63 45H17Z" fill="#ae926b"/><path d="M40 35C24 29 34 15 43 5c-2 11 12 17 5 25z" fill="#e7ab57"/><path d="M40 34q-6-7 2-17 8 11-2 17" fill="#fff0b7"/>',
 path:'<path d="m10 52 20-9 11 6-20 9zm26-13 19-9 12 6-20 9zm19-14 10-5 10 6-12 6z" fill="#b5a184" stroke="#6e624d"/>',
 tree:'<path d="M39 53 43 23" stroke="#8a6345" stroke-width="6"/><ellipse cx="40" cy="23" rx="21" ry="17" fill="#65794b"/><ellipse cx="29" cy="22" rx="12" ry="9" fill="#859259"/><ellipse cx="50" cy="17" rx="11" ry="8" fill="#9aa16a"/>',
 flowers:'<g fill="#d3ae63"><circle cx="23" cy="35" r="8"/><circle cx="53" cy="24" r="8"/><circle cx="49" cy="47" r="8"/></g><g fill="#aa7776"><circle cx="34" cy="23" r="7"/><circle cx="63" cy="39" r="7"/></g><g fill="#f2dfb1"><circle cx="23" cy="35" r="3"/><circle cx="53" cy="24" r="3"/><circle cx="49" cy="47" r="3"/></g>',
 lamp:'<ellipse cx="40" cy="47" rx="18" ry="9" fill="#b18b54"/><path d="M40 43C24 35 35 23 42 12c0 12 10 18 4 26z" fill="#f5bf73"/>',
 well:'<ellipse cx="40" cy="44" rx="21" ry="12" fill="#927f64"/><path d="M19 34v12q21 18 42 0V34" fill="#a38b69"/><ellipse cx="40" cy="33" rx="21" ry="12" fill="#bda384"/><ellipse cx="40" cy="33" rx="13" ry="7" fill="#536c72"/>',
 vine:'<path d="M20 52V18M40 52V15M60 52V18M14 25H66" stroke="#a68b65" stroke-width="3"/><path d="M16 32Q40 8 65 33" stroke="#78945c" stroke-width="13" fill="none"/><g fill="#8c708b"><circle cx="28" cy="32" r="5"/><circle cx="49" cy="35" r="5"/><circle cx="56" cy="28" r="4"/></g>',
 bridge:'<path d="M4 44Q40 64 76 40" stroke="#608993" stroke-width="15" fill="none"/><path d="M11 49Q40 6 69 49L61 53Q40 23 19 53Z" fill="#b19a78" stroke="#78664d" stroke-width="2"/>',
 pond:'<ellipse cx="40" cy="40" rx="29" ry="17" fill="#627b79" stroke="#b6a583" stroke-width="4"/><path d="M25 37q12-5 28 0M36 45q10-3 19 0" fill="none" stroke="#b0d1c7" stroke-width="2"/>',
 fall:'<path d="m12 55 8-34 13 3 9-13 23 12 4 32Z" fill="#94836b"/><path d="M36 21h14l-2 24 16 11-36 0 10-11z" fill="#75adba"/><path d="M42 22v23l12 9" fill="none" stroke="#c4e2de" stroke-width="3"/>',
 chamber:'<path d="M16 53V27L40 12 64 27v26Z" fill="#b49a73"/><path d="m12 28 28-19 28 19" fill="none" stroke="#826746" stroke-width="6"/><path d="M32 53V35a8 8 0 0 1 16 0v18" fill="#3b3025"/>',
 memorial:'<path d="M25 53 28 17 38 12 51 17 55 53Z" fill="#bda68a" stroke="#82705a" stroke-width="2"/><path d="M35 29h11m-11 7h11" stroke="#77624a" stroke-width="2"/>'
};return '<svg viewBox="0 0 80 66" aria-hidden="true"><ellipse cx="40" cy="53" rx="32" ry="10" fill="#000" opacity=".15"/>'+ (art[type]||art.memorial)+(level>1?'<circle cx="65" cy="12" r="5" fill="#e7bd72"/>':'')+'</svg>'}
function altarLevel(){return 1+Math.floor(allPrayerDays()/7)}
function world(){let g=garden();region=Math.max(0,Math.min(region,g.land-1));let b=resources(),cells=Array.from({length:16},(_,i)=>{let t=g.tiles.find(t=>t.region===region&&t.cell===i),altar=region===0&&i===5;let item=t&&catalog.find(x=>x.id===t.type);let title=altar?"Living altar · "+altarLevel():t?t.name:"Empty plot";return '<button class="plot '+(altar?"altar":t?"built":"empty")+'" aria-label="'+esc(title)+'" onclick="plot('+i+')">'+(altar?tileArt("altar",altarLevel()):t?tileArt(item?.symbol||"memorial",t.level):'<span class="empty-plus">+</span>')+'<span class="plot-name">'+esc(altar?"Altar · "+altarLevel():t?t.name:"Build")+'</span>'+(t&&t.level>1?'<span class="plot-level">'+t.level+'</span>':'')+'</button>'}).join("");let nextCost=landCost();$("main").innerHTML='<div class="eyebrow">Pray · Cultivate · Remember</div><h1>Abide</h1>'+resourceBar()+'<section class="world-card"><div class="row spread"><div><small>YOUR SANCTUARY · LAND '+(region+1)+' OF '+g.land+'</small><h2>'+terrainName(region)+'</h2></div><button onclick="economyInfo()" aria-label="About resources">?</button></div><div class="map-tools"><button onclick="shiftRegion(-1)" '+(region===0?"disabled":"")+'>‹</button><span>'+ (moveId?"Select an empty plot to move":terrainName(region))+'</span><button onclick="shiftRegion(1)" '+(region===g.land-1?"disabled":"")+'>›</button></div><div class="world-grid">'+cells+'</div>'+(moveId?'<button onclick="moveId=null;world()">Cancel move</button>':'')+'<p class="muted map-caption">Tap a plot to build, or a landmark to explore its story.</p><button class="primary wide" onclick="expandLand()" '+(!affordable(nextCost)?"disabled":"")+'>Expand territory</button><small class="cost-label">'+costText(nextCost)+'</small></section><div class="card"><h2>Living altar</h2><p>'+allPrayerDays()+' cumulative days of prayer · Altar level '+altarLevel()+'</p>'+goalBar("Next altar level",allPrayerDays(),7)+'<small>The flame never goes out because of missed days.</small></div><div class="row quick-links"><button onclick="navGarden(\'Prayer\')">Pray</button><button onclick="navGarden(\'Thanks\')">Give thanks</button><button onclick="navGarden(\'Memorial\')">Remember</button></div>'+memoryCard()}
function shiftRegion(d){region=Math.max(0,Math.min(garden().land-1,region+d));world()}
function landCost(){let n=garden().land;return {stone:12+2*(n-1),seed:8+n-1,water:4+n-1}}
function expandLand(){let g=garden(),cost=landCost();if(!affordable(cost))return;if(!confirm("Open another territory for "+costText(cost)+"?"))return;g.landCosts.push(cost);region=g.land++;save();world()}
function plot(i){let g=garden(),t=g.tiles.find(t=>t.region===region&&t.cell===i);if(region===0&&i===5){if(moveId)return;modal("Living altar",tileArt("altar",altarLevel())+'<p>Level '+altarLevel()+' · '+allPrayerDays()+' days with recorded prayer.</p>'+goalBar("Next level",allPrayerDays(),7)+'<p>Prayer days are cumulative. The flame is a reminder, not a measure of your faith.</p><button class="primary" onclick="close();navGarden(\'Prayer\')">Go to prayer</button>');return}if(t){if(moveId)return;landmark(t.id);return}if(moveId){let moved=g.tiles.find(x=>x.id===moveId);if(moved){moved.region=region;moved.cell=i;save()}moveId=null;world();return}selectedCell={region,cell:i};market()}
function unplacedMemories(){let g=garden();return s.prayers.filter(p=>p.status==="answered"&&!g.tiles.some(t=>t.freeFor===p.id))}
function market(){modal("Build a landmark",'<p class="muted">Choose what to build. You can dedicate it to a prayer, thanksgiving or reflection.</p>'+resourceBar()+unplacedMemories().map(p=>'<div class="shop-row">'+tileArt("memorial")+'<div><b>'+esc(p.title)+'</b><small>Free memorial of an answered prayer</small></div><button onclick="freeMemorial(\''+p.id+'\')">Place</button></div>').join("")+catalog.map(x=>'<div class="shop-row">'+tileArt(x.symbol)+'<div><b>'+x.name+'</b><small>'+costText(x.cost)+'</small></div><button '+(!affordable(x.cost)?"disabled":"")+' onclick="buildForm(\''+x.id+'\')">Build</button></div>').join(""))}
function dedicationOptions(value=""){let g=garden(),rows=[...s.prayers.map(p=>({id:"p:"+p.id,title:p.title})),...g.thanks.map(p=>({id:"t:"+p.id,title:p.title})),...g.reflections.map(p=>({id:"r:"+p.id,title:p.title}))];return '<option value="">No dedication</option>'+rows.map(x=>'<option value="'+esc(x.id)+'" '+(value===x.id?"selected":"")+'>'+esc(x.title)+'</option>').join("")}
function buildForm(id){let item=catalog.find(x=>x.id===id);if(!item)return;modal("Build "+item.name,tileArt(item.symbol)+'<p>'+costText(item.cost)+'</p><label>Dedicate to a memory<select id="dedication" onchange="if(this.value)$(\'buildName\').value=this.options[this.selectedIndex].text">'+dedicationOptions()+'</select></label>'+field("Landmark name","buildName",item.name)+'<button class="primary" onclick="purchase(\''+id+'\')">Place landmark</button>')}
function emptySelected(){let g=garden();return selectedCell&&selectedCell.region>=0&&selectedCell.region<g.land&&selectedCell.cell>=0&&selectedCell.cell<16&&!(selectedCell.region===0&&selectedCell.cell===5)&&!g.tiles.some(t=>t.region===selectedCell.region&&t.cell===selectedCell.cell)}
function purchase(id){let item=catalog.find(x=>x.id===id);if(!item||!emptySelected()||!affordable(item.cost))return;garden().tiles.push({id:uid(),type:id,name:$("buildName").value.trim()||item.name,dedication:$("dedication").value,level:1,spent:{...item.cost},...selectedCell,created:Date.now()});selectedCell=null;close()}
function freeMemorial(id){let p=unplacedMemories().find(x=>x.id===id);if(!p||!emptySelected())return;garden().tiles.push({id:uid(),type:"memorial",name:p.title,dedication:"p:"+id,freeFor:id,level:1,spent:{},...selectedCell,created:Date.now()});selectedCell=null;close()}
function story(key){if(!key)return "";let g=garden(),kind=key.slice(0,2),id=key.slice(2),p=(kind==="p:"?s.prayers:kind==="t:"?g.thanks:g.reflections).find(x=>x.id===id);if(!p)return "<p>Original memory is unavailable.</p>";return '<div class="card"><small>DEDICATED MEMORY</small><h2>'+esc(p.title)+'</h2><p class="notes">'+esc(p.notes||"")+'</p>'+(kind==="p:"?'<small>'+esc(p.status)+' · '+(p.count||0)+' prayers · '+prayerDates(p).length+' days</small>'+(p.answer?'<p><b>Remembered answer:</b> '+esc(p.answer)+'</p>':''):'<small>'+date(p.created)+'</small>')+'</div>'}
function upgradeCost(t){let item=catalog.find(x=>x.id===t.type),cost={},factor=t.level;for(let k of resourceKeys)if(item?.cost[k])cost[k]=Math.max(1,Math.ceil(item.cost[k]/2)+factor-1);return Object.keys(cost).length?cost:{stone:factor+1}}
function landmark(id){let t=garden().tiles.find(x=>x.id===id);if(!t)return;let item=catalog.find(x=>x.id===t.type),cost=upgradeCost(t);modal(t.name,'<div class="landmark-art">'+tileArt(item?.symbol||"memorial",t.level)+'</div><p>'+esc(item?.name||"Memorial stone")+' · Level '+t.level+'</p>'+story(t.dedication)+field("Name","landName",t.name)+'<label>Dedication<select id="landDed">'+dedicationOptions(t.dedication)+'</select></label><button onclick="renameLand(\''+id+'\')">Save details</button><hr><button class="primary wide" '+(!affordable(cost)?"disabled":"")+' onclick="upgrade(\''+id+'\')">Upgrade to level '+(t.level+1)+'</button><small>'+costText(cost)+'</small><p><button onclick="beginMove(\''+id+'\')">Move landmark</button></p>')}
function renameLand(id){let t=garden().tiles.find(x=>x.id===id);if(!t)return;t.name=$("landName").value.trim()||t.name;t.dedication=$("landDed").value;close()}
function upgrade(id){let t=garden().tiles.find(x=>x.id===id);if(!t)return;let cost=upgradeCost(t);if(!affordable(cost))return;for(let k of resourceKeys)t.spent[k]=(t.spent[k]||0)+(cost[k]||0);t.level++;save();landmark(id)}
function beginMove(id){moveId=id;$("modal").close();world()}
function economyInfo(){modal("Resources & meaning",'<p>These are building materials for your garden, not spiritual scores or a measure of God’s favor.</p><p><b>Stones:</b> one per request on each distinct day of prayer. Repeated hourly prayers are still remembered.</p><p><b>Seeds:</b> two for each new thanksgiving.</p><p><b>Water:</b> two for each new prayer reflection.</p><p><b>Oil:</b> one on each day with a recorded prayer session.</p><p>Starter supplies: 5 stones, 4 seeds, 2 water. Existing dated prayer history counts. Answers receive a free memorial, not a currency bonus. Nothing expires.</p>')}
function entries(kind){let g=garden(),isThanks=kind==="thanks",arr=g[kind];$("main").innerHTML='<div class="eyebrow">'+(isThanks?"With thanksgiving":"Remember His works")+'</div><h1>'+(isThanks?"Give thanks":"Prayer journal")+'</h1>'+resourceBar()+'<div class="card"><h2>'+(isThanks?"What are you thankful for?":"What are you learning in prayer?")+'</h2><p class="muted">'+(isThanks?"Remember everyday blessings, God’s character and His provision.":"Record insights, struggles, Scripture and experiences with God.")+'</p><button class="primary wide" onclick="entryForm(\''+kind+'\')">'+(isThanks?"+ Give thanks":"+ New reflection")+'</button></div>'+arr.slice().reverse().map(e=>'<div class="card"><small>'+date(e.created)+'</small><h2>'+esc(e.title)+'</h2><p class="notes">'+esc(e.notes)+'</p><button onclick="entryForm(\''+kind+'\',\''+e.id+'\')">Edit</button></div>').join("")+(!arr.length?'<p class="muted">Your memories will appear here.</p>':'')}
function entryForm(kind,id){let e=garden()[kind].find(x=>x.id===id)||{};modal(kind==="thanks"?"Thanksgiving":"Prayer reflection",field("Title","et",e.title)+field("Your thoughts","enote",e.notes,true)+'<button class="primary wide" onclick="saveEntry(\''+kind+'\',\''+(id||"")+'\')">Save</button>')}
function saveEntry(kind,id){if(!["thanks","reflections"].includes(kind))return;let title=$("et").value.trim(),notes=$("enote").value.trim();if(!title||!notes){alert("Add a title and a few words about this memory.");return}let arr=garden()[kind],e=arr.find(x=>x.id===id);if(e)Object.assign(e,{title,notes});else arr.push({id:uid(),title,notes,created:Date.now()});close()}
function goalBar(label,n,step){let target=(Math.floor(n/step)+1)*step,start=target-step;return '<div class="goal"><div class="row spread"><small>'+esc(label)+'</small><small>'+n+' / '+target+'</small></div>'+bar(n-start,step)+'</div>'}
function memoryCard(){let g=garden(),now=new Date(),today=dateKey(now),same=t=>{let k=dateKey(t);return k&&k!==today&&k.slice(5)===today.slice(5)};let memories=[...s.prayers.flatMap(p=>[{title:p.title,notes:p.notes,created:p.created},{title:p.title+" · answered",notes:p.answer,created:p.answeredAt}]),...g.thanks,...g.reflections,...s.journal].filter(x=>same(x.created));return '<div class="card"><div class="eyebrow">On this day</div><h2>Remember His faithfulness</h2>'+(memories.length?memories.map(m=>'<p><b>'+esc(m.title)+'</b><br><small>'+date(m.created)+'</small><br><span class="notes">'+esc(m.notes||"")+'</span></p>').join(""):'<p class="muted">No memories from this date in earlier years yet. Your history will become richer as you continue.</p>')+'</div>'}
function memorials(){let g=garden(),answers=s.prayers.filter(p=>p.status==="answered");$("main").innerHTML='<div class="eyebrow">Hitherto hath the Lord helped us</div><h1>Memorial</h1><div class="card"><h2>Ebenezers</h2><p class="muted">Each milestone leads to another. No final rank.</p>'+goalBar("Prayer days",allPrayerDays(),7)+goalBar("Thanksgivings",g.thanks.length,10)+goalBar("Reflections",g.reflections.length,5)+goalBar("Landmarks",g.tiles.length,5)+goalBar("Territories",g.land,3)+'</div>'+memoryCard()+'<h2>Stones of remembrance</h2><p class="muted">Every answered prayer has a memorial, regardless of how many times you prayed. Place its free stone on an empty plot.</p>'+ (answers.map(p=>'<div class="card memorial-row">'+tileArt("memorial")+'<div><h2>'+esc(p.title)+'</h2><small>'+ (p.answeredAt?date(p.answeredAt)+" · ":"")+(p.count||0)+' recorded prayers</small><p class="notes">'+esc(p.answer||"Answer remembered")+'</p><button onclick="memStory(\''+p.id+'\')">Read memory</button> <small>'+(g.tiles.some(t=>t.freeFor===p.id)?"Stone placed":"Free stone available")+'</small></div></div>').join("")||'<p class="muted">Answered prayers will appear here.</p>')}
function memStory(id){let p=s.prayers.find(x=>x.id===id);if(p)modal("Stone of remembrance",story("p:"+id)+'<button onclick="close();navGarden(\'World\')">Visit world</button>')}
function sessionCard(){let g=garden();return '<div class="card session"><div class="row spread"><div><h2>Quiet prayer</h2><small>Optional session timer · '+g.sessions.length+' recorded</small></div><span id="sessionTime">'+(g.started?sessionElapsed():"00:00")+'</span></div><button class="primary wide" onclick="toggleSession()">'+(g.started?"Finish session":"Begin prayer")+'</button>'+(g.started?'<button onclick="cancelSession()">Cancel without recording</button>':'')+'<p class="muted">Put your phone down if you like. The timer is optional.</p></div>'}
function sessionElapsed(){let n=Math.max(0,Math.floor((Date.now()-garden().started)/1000));return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}
function toggleSession(){let g=garden();if(g.started){g.sessions.push({at:Date.now(),seconds:Math.max(0,Math.floor((Date.now()-g.started)/1000))});delete g.started}else g.started=Date.now();save();render()}
function cancelSession(){delete garden().started;save();render()}
function chooseIntercession(){let list=s.prayers.filter(p=>p.status==="active"&&Date.now()-(p.last||0)>=3600000).sort((a,b)=>(a.last||0)-(b.last||0));if(!list.length){modal("Intercession","<p>No active requests are ready right now. You can still pray freely.</p>");return}let p=list[0];modal("Someone to pray for",'<h2>'+esc(p.title)+'</h2><p class="notes">'+esc(p.notes)+'</p><button class="primary" onclick="recordIntercession(\''+p.id+'\')">I prayed</button>')}
function recordIntercession(id){$("modal").close();pray(id)}
function renderGarden(){let g=garden();s.page="Prayer";theme();reading=false;request++;let nav=[["World","⌂"],["Prayer","♧"],["Thanks","✿"],["Journal","▤"],["Memorial","◆"]];$("nav").innerHTML=nav.map(([p,icon])=>'<button class="'+(g.tab===p?"on":"")+'" onclick="navGarden(\''+p+'\')"><span>'+icon+'</span>'+p+'</button>').join("");if(g.tab==="World")world();else if(g.tab==="Prayer")prayer();else if(g.tab==="Thanks")entries("thanks");else if(g.tab==="Journal")entries("reflections");else memorials()}
setInterval(()=>{let g=garden(),el=$("sessionTime");if(el&&g.started)el.textContent=sessionElapsed()},1000);

render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
