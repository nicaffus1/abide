<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#284d40"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Abide</title><style>
:root{color-scheme:light;--bg:#f5f4ef;--card:#fff;--ink:#23372f;--muted:#65766d;--line:#dce4dc;--green:#285443;--soft:#e8efe8}*{box-sizing:border-box}body.dark{color-scheme:dark;--bg:#131c18;--card:#202b25;--ink:#e8eee9;--muted:#a2b5a9;--line:#38483e;--green:#8ab7a0;--soft:#293d33}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}header,nav{position:fixed;left:0;right:0;z-index:4;background:var(--card);border-color:var(--line);border-style:solid;border-width:0}header{top:0;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;border-bottom-width:1px;display:flex;align-items:center;justify-content:space-between}header strong{font: bold 25px Georgia;color:var(--green)}header small{display:block;color:var(--muted);font-size:11px;letter-spacing:.12em}nav{bottom:0;padding:8px 4px calc(8px + env(safe-area-inset-bottom));border-top-width:1px;display:flex;justify-content:space-around}nav button{flex:1;background:none;color:var(--muted);font-size:11px;padding:5px 0}nav button span{display:block;font-size:23px;margin-bottom:4px}nav button.on{color:var(--green);font-weight:750}main{max-width:760px;margin:auto;padding:calc(90px + env(safe-area-inset-top)) 16px calc(105px + env(safe-area-inset-bottom))}h1{font:700 32px Georgia;margin:8px 0}h2{font:700 22px Georgia;margin:0 0 12px}p{line-height:1.55}small,.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.grow{flex:1}button,input,select,textarea{font:inherit;border-radius:10px}button{cursor:pointer;border:0;padding:11px 14px;background:var(--soft);color:var(--ink);font-weight:600}button.primary{background:var(--green);color:var(--bg)}button:disabled{opacity:.5}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0}textarea{min-height:100px;resize:vertical}label{font-size:13px;color:var(--muted)}.pill{font-size:12px}.bar{height:9px;background:var(--soft);border-radius:12px;overflow:hidden;margin:12px 0}.bar i{display:block;background:var(--green);height:100%}.verse{font-family:Georgia,serif;line-height:1.85;white-space:pre-wrap}.verse sup{font:11px system-ui;color:var(--muted)}.tabs{display:flex;gap:6px;overflow:auto}.tabs button{white-space:nowrap;font-size:13px}.tabs .on{background:var(--green);color:var(--bg)}details summary{cursor:pointer;font-weight:650}a{color:var(--green)}.notes{white-space:pre-wrap;overflow-wrap:anywhere}.eyebrow{font-size:11px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase}.danger{color:#bd6262}dialog{max-width:520px;width:calc(100% - 24px);max-height:85dvh;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:20px}dialog::backdrop{background:#0008}.big{font-size:24px;line-height:1.7}</style></head><body><header><div><strong>✝ Abide</strong><small>REMAIN IN HIM</small></div><button onclick="settings()" aria-label="Settings">⚙</button></header><main id="main"></main><nav id="nav"></nav><dialog id="modal"></dialog><script>
const books="Genesis:50|Exodus:40|Leviticus:27|Numbers:36|Deuteronomy:34|Joshua:24|Judges:21|Ruth:4|1 Samuel:31|2 Samuel:24|1 Kings:22|2 Kings:25|1 Chronicles:29|2 Chronicles:36|Ezra:10|Nehemiah:13|Esther:10|Job:42|Psalms:150|Proverbs:31|Ecclesiastes:12|Song of Solomon:8|Isaiah:66|Jeremiah:52|Lamentations:5|Ezekiel:48|Daniel:12|Hosea:14|Joel:3|Amos:9|Obadiah:1|Jonah:4|Micah:7|Nahum:3|Habakkuk:3|Zephaniah:3|Haggai:2|Zechariah:14|Malachi:4|Matthew:28|Mark:16|Luke:24|John:21|Acts:28|Romans:16|1 Corinthians:16|2 Corinthians:13|Galatians:6|Ephesians:6|Philippians:4|Colossians:4|1 Thessalonians:5|2 Thessalonians:3|1 Timothy:6|2 Timothy:4|Titus:3|Philemon:1|Hebrews:13|James:5|1 Peter:5|2 Peter:3|1 John:5|2 John:1|3 John:1|Jude:1|Revelation:22".split("|").map(x=>x.split(":"));const defaults=()=>({page:"Bible",book:42,chapter:1,translation:"web",read:{},seconds:{},prayers:[],journal:[],people:[],devotions:[],history:[],theme:"system",font:20,goal:15,categories:["Knowing God","Scripture insights","God’s faithfulness","Convictions","Wisdom","Gratitude","Trials","Spiritual growth","Testimonies","Questions"]});let s;try{s={...defaults(),...JSON.parse(localStorage.getItem("abide-v1")||"{}")}}catch{ s=defaults() }const $=id=>document.getElementById(id),save=()=>localStorage.setItem("abide-v1",JSON.stringify(s)),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),day=()=>new Date().toLocaleDateString("en-CA"),uid=()=>crypto.randomUUID(),date=x=>new Date(x).toLocaleDateString(),pages=["Bible","Prayer","Journal","Encourage","Devotional"],icons=["▤","♡","▧","✉","✎"];let prayerTab="active",journalFilter="",devTab="all",chosen="",draft="",loaded=false,request=0,lastAction=Date.now(),reading=false;
function theme(){document.body.classList.toggle("dark",s.theme==="dark"||(s.theme==="system"&&matchMedia("(prefers-color-scheme: dark)").matches))}matchMedia("(prefers-color-scheme: dark)").addEventListener("change",theme);function go(p){s.page=p;save();render();window.scrollTo(0,0)}function render(){theme();$("nav").innerHTML=pages.map((p,i)=>'<button class="'+(p===s.page?"on":"")+'" onclick="go(\''+p+'\')"><span>'+icons[i]+'</span>'+p+'</button>').join("");reading=false;request++;({Bible:bible,Prayer:prayer,Journal:journal,Encourage:encourage,Devotional:devotional}[s.page]||bible)()}function modal(title,body){$("modal").innerHTML='<div class="row spread"><h2>'+esc(title)+'</h2><button onclick="$(&quot;modal&quot;).close()">×</button></div>'+body;if(!$("modal").open)$("modal").showModal()}function close(){ $("modal").close();save();render() }function field(label,id,value="",multi=false){return '<label>'+label+(multi?'<textarea id="'+id+'">'+esc(value)+'</textarea>':'<input id="'+id+'" value="'+esc(value)+'">')+'</label>'}function options(arr,val){return arr.map(x=>'<option '+(x===val?'selected':'')+'>'+esc(x)+'</option>').join("")}function bar(n,total){return '<div class="bar"><i style="width:'+Math.min(100,n/total*100)+'%"></i></div>'}function ref(){return books[s.book][0]+" "+s.chapter}function count(a,b){return Object.keys(s.read).filter(k=>{let i=+k.split(":")[0];return i>=a&&i<b}).length}function stats(){let n=count(0,66),today=Math.floor((s.seconds[day()]||0)/60);return '<div class="row spread"><b>'+n+' / 1,189 chapters</b><b>'+Math.round(n/1189*100)+'%</b></div>'+bar(n,1189)+'<div class="row spread"><small>Today: <span id="mins">'+today+'</span> / '+s.goal+' min</small><small>All time: '+Math.floor(Object.values(s.seconds).reduce((a,b)=>a+b,0)/60)+' min</small></div>'}function bible(){let n=count(s.book,s.book+1);$("main").innerHTML='<div class="eyebrow">Your reading journey</div><h1>Scripture</h1><div class="card">'+stats()+'<details><summary>Testament & book progress</summary><p>Old Testament '+count(0,39)+'/929'+bar(count(0,39),929)+'</p><p>New Testament '+count(39,66)+'/260'+bar(count(39,66),260)+'</p><p>'+esc(books[s.book][0])+' '+n+'/'+books[s.book][1]+bar(n,+books[s.book][1])+'</p></details></div><div class="card"><div class="row"><select class="grow" style="width:auto" onchange="s.book=+this.value;s.chapter=1;save();bible()">'+books.map((b,i)=>'<option value="'+i+'" '+(i===s.book?'selected':'')+'>'+b[0]+'</option>').join("")+'</select><select style="width:auto" onchange="s.chapter=+this.value;save();bible()">'+Array.from({length:+books[s.book][1]},(_,i)=>'<option '+(i+1===s.chapter?'selected':'')+'>'+(i+1)+'</option>').join("")+'</select></div><div class="row spread"><button onclick="step(-1)">‹ Previous</button><small>'+s.translation.toUpperCase()+'</small><button onclick="step(1)">Next ›</button></div><h2 style="margin-top:20px">'+esc(ref())+'</h2><div id="verses" class="verse" style="font-size:'+s.font+'px">Loading chapter…</div><p><a target="_blank" rel="noopener" href="https://www.esv.org/'+encodeURIComponent(ref())+'/">Read this chapter in ESV ↗</a></p><button class="primary" onclick="mark()">'+(s.read[s.book+":"+s.chapter]?'✓ Completed · undo':'Mark chapter read')+'</button></div>';loadChapter()}async function loadChapter(){let token=++request;reading=false;let key=s.translation+":"+ref(),url="https://bible-api.com/"+encodeURIComponent(ref())+"?translation="+s.translation;try{let data;try{data=JSON.parse(localStorage.getItem("scripture:"+key))}catch{}if(!data){let r=await fetch(url);if(!r.ok)throw Error();data=await r.json();if(!Array.isArray(data.verses))throw Error();try{localStorage.setItem("scripture:"+key,JSON.stringify(data))}catch{}}if(token!==request||s.page!=="Bible")return;$("verses").innerHTML=data.verses.map(v=>'<sup>'+v.verse+'</sup> '+esc(v.text.trim())).join(" ");reading=true;lastAction=Date.now()}catch{if(token===request&&$("verses"))$("verses").textContent="Chapter unavailable. Connect to the internet and try again."}}function step(d){let c=s.chapter+d;if(c<1){if(!s.book)return;s.book--;c=+books[s.book][1]}if(c>+books[s.book][1]){if(s.book===65)return;s.book++;c=1}s.chapter=c;save();bible()}function mark(){let k=s.book+":"+s.chapter;if(s.read[k])delete s.read[k];else s.read[k]=Date.now();save();bible()}["pointerdown","scroll","keydown","touchstart"].forEach(e=>addEventListener(e,()=>lastAction=Date.now(),{passive:true}));setInterval(()=>{if(s.page==="Bible"&&reading&&!document.hidden&&!$("modal").open&&Date.now()-lastAction<120000){s.seconds[day()]=(s.seconds[day()]||0)+5;save();if($("mins"))$("mins").textContent=Math.floor(s.seconds[day()]/60)}document.querySelectorAll("[data-pray]").forEach(b=>{let p=s.prayers.find(x=>x.id===b.dataset.pray);if(p&&Date.now()-(p.last||0)>=3600000){b.disabled=false;b.textContent="Pray"}})},5000);
function prayer(){let list=s.prayers.filter(x=>x.status===prayerTab);$("main").innerHTML='<div class="eyebrow">Bring everything before Him</div><div class="row spread"><h1>Prayer</h1><button class="primary" onclick="editPrayer()">+ Request</button></div><div class="tabs">'+["active","answered","archived"].map(t=>'<button class="'+(t===prayerTab?"on":"")+'" onclick="prayerTab=\''+t+'\';prayer()">'+({active:"Active",answered:"Answered",archived:"Unanswered / removed"}[t])+' ('+s.prayers.filter(x=>x.status===t).length+')</button>').join("")+'</div>'+ (list.map(p=>'<div class="card"><div class="row spread"><b>'+esc(p.title)+'</b>'+(p.status==="active"?'<button data-pray="'+p.id+'" '+(Date.now()-(p.last||0)<3600000?'disabled':'')+' onclick="pray(\''+p.id+'\')">'+(Date.now()-(p.last||0)<3600000?'✓ Prayed':'Pray')+'</button>':'')+'</div><details><summary class="muted">Details · '+esc(p.category||"General")+'</summary><p class="notes">'+esc(p.notes)+'</p><small>Added '+date(p.created)+' · Prayed '+(p.count||0)+' times</small>'+(p.answer?'<p><b>Answer:</b> '+esc(p.answer)+'</p>':'')+'<div class="row"><button onclick="editPrayer(\''+p.id+'\')">Edit</button>'+(p.status==="active"?'<button onclick="answer(\''+p.id+'\')">Answered</button><button onclick="statusPrayer(\''+p.id+'\',\'archived\')">Archive</button>':'<button onclick="statusPrayer(\''+p.id+'\',\'active\')">Restore</button>')+'</div></details></div>').join("")||'<div class="card muted">No requests here yet.</div>')+'<p class="muted">Each Pray button resets one hour after use.</p>'}function editPrayer(id){let p=s.prayers.find(x=>x.id===id)||{};modal(id?"Edit request":"New request",field("Person or request","pt",p.title)+field("Category","pc",p.category)+field("Prayer details / updates","pn",p.notes,true)+'<button class="primary" onclick="savePrayer(\''+(id||"")+'\')">Save request</button>')}function savePrayer(id){let title=$("pt").value.trim();if(!title)return;let p=s.prayers.find(x=>x.id===id);if(!p){p={id:uid(),created:Date.now(),status:"active",count:0};s.prayers.unshift(p)}Object.assign(p,{title,category:$("pc").value,notes:$("pn").value});close()}function pray(id){let p=s.prayers.find(x=>x.id===id);if(Date.now()-(p.last||0)<3600000)return;p.last=Date.now();p.count=(p.count||0)+1;(p.log??=[]).push(p.last);save();prayer()}function statusPrayer(id,status){s.prayers.find(x=>x.id===id).status=status;save();prayer()}function answer(id){modal("Record answered prayer",field("How was it answered?","pa","",true)+'<button class="primary" onclick="let p=s.prayers.find(x=>x.id===\''+id+'\');p.answer=$(&quot;pa&quot;).value;p.status=\'answered\';p.answeredAt=Date.now();close()">Save answer</button>')}
function journal(){let list=s.journal.filter(x=>(!journalFilter||x.category===journalFilter));$("main").innerHTML='<div class="eyebrow">Remember His works</div><div class="row spread"><h1>Journal</h1><button class="primary" onclick="editJournal()">+ Entry</button></div><select onchange="journalFilter=this.value;journal()"><option value="">All categories</option>'+options(s.categories,journalFilter)+'</select><input placeholder="Search entries" oninput="filterCards(this.value)"><div id="entries">'+(list.map(j=>'<div class="card entry"><small>'+esc(j.category)+' · '+date(j.created)+'</small><h2>'+esc(j.title)+'</h2><small>'+esc(j.scripture)+'</small><p class="notes">'+esc(j.notes)+'</p><button onclick="editJournal(\''+j.id+'\')">Edit</button></div>').join("")||'<div class="card muted">Start recording your faith journey.</div>')+'</div>'}function filterCards(q){document.querySelectorAll(".entry").forEach(e=>e.hidden=!e.textContent.toLowerCase().includes(q.toLowerCase()))}function editJournal(id){let j=s.journal.find(x=>x.id===id)||{};modal("Journal entry",field("Title","jt",j.title)+'<label>Category<select id="jc">'+options(s.categories,j.category)+'</select></label>'+field("Scripture / tags","js",j.scripture)+field("Reflection","jn",j.notes,true)+'<button class="primary" onclick="saveJournal(\''+(id||"")+'\')">Save entry</button>'+(id?'<button class="danger" onclick="remove(\'journal\',\''+id+'\')">Delete</button>':''))}function saveJournal(id){let title=$("jt").value.trim();if(!title)return;let j=s.journal.find(x=>x.id===id);if(!j){j={id:uid(),created:Date.now()};s.journal.unshift(j)}Object.assign(j,{title,category:$("jc").value,scripture:$("js").value,notes:$("jn").value});close()}function remove(group,id){if(confirm("Delete this permanently?")){s[group]=s[group].filter(x=>x.id!==id);close()}}
const templates=["I was thinking of you today and wanted to encourage you. May the Lord strengthen you and give you peace in whatever you face. (Isaiah 41:10)","Just a reminder that your labor in the Lord is not in vain. Keep looking to Christ. (1 Corinthians 15:58)","Praying that God gives you wisdom, endurance, and joy today. You are not forgotten. (James 1:5)","I appreciate you and wanted to remind you of the Lord’s steadfast love and faithfulness. (Lamentations 3:22–23)","May the God of hope fill you with joy and peace as you trust in Him. (Romans 15:13)"];function randomPerson(){if(!s.people.length)return;let pool=s.people.filter(p=>p.id!==chosen);if(!pool.length)pool=s.people;pool.sort((a,b)=>(a.last||0)-(b.last||0));chosen=pool[Math.floor(Math.random()*Math.max(1,Math.ceil(pool.length/2)))].id;generate()}function generate(){let p=s.people.find(x=>x.id===chosen);let old=draft;do{draft=(p?"Hey "+p.name.split(" ")[0]+"! ":"")+templates[Math.floor(Math.random()*templates.length)]}while(draft===old);encourage()}function encourage(){let p=s.people.find(x=>x.id===chosen);$("main").innerHTML='<div class="eyebrow">Build one another up</div><h1>Encourage</h1><div class="card"><small>Someone to encourage</small><h2>'+esc(p?.name||"Choose a person")+'</h2><button onclick="randomPerson()">Shuffle person</button><select onchange="chosen=this.value;generate()"><option value="">Choose contact</option>'+s.people.map(x=>'<option value="'+x.id+'" '+(x.id===chosen?'selected':'')+'>'+esc(x.name)+'</option>').join("")+'</select><textarea id="msg" oninput="draft=this.value" placeholder="Write or generate a message">'+esc(draft)+'</textarea><div class="row"><button onclick="generate()">Generate message</button><button class="primary" '+(!p?'disabled':'')+' onclick="sendText()">Open Messages</button></div><small>Review and send in Messages. Mark sent here afterward.</small>'+(p?'<p><button onclick="sent()">Mark as sent</button></p>':'')+'</div><div class="row spread"><h2>People</h2><button onclick="editPerson()">+ Person</button></div>'+s.people.map(x=>'<div class="card row spread"><div><b>'+esc(x.name)+'</b><br><small>'+ (x.last?'Last encouraged '+date(x.last):'Not yet encouraged')+'</small></div><button onclick="editPerson(\''+x.id+'\')">Edit</button></div>').join("")+'<details class="card"><summary>Encouragement history</summary>'+s.history.map(h=>'<p>'+esc(h.name)+' · '+date(h.time)+'<br>'+esc(h.message)+'</p>').join("")+'</details>'}function editPerson(id){let p=s.people.find(x=>x.id===id)||{};modal("Contact",field("Name","en",p.name)+field("Mobile number","ep",p.phone)+'<button class="primary" onclick="savePerson(\''+(id||"")+'\')">Save</button>'+(id?'<button class="danger" onclick="remove(\'people\',\''+id+'\')">Delete</button>':''))}function savePerson(id){let name=$("en").value.trim(),phone=$("ep").value.trim();if(!name||!phone)return;let p=s.people.find(x=>x.id===id);if(!p){p={id:uid()};s.people.push(p)}Object.assign(p,{name,phone});close()}function sendText(){let p=s.people.find(x=>x.id===chosen);if(!p||!draft.trim())return;location.href="sms:"+p.phone.replace(/[^+\d]/g,"")+( /iPhone|iPad|iPod/.test(navigator.userAgent)?"&":"?")+"body="+encodeURIComponent(draft)}function sent(){let p=s.people.find(x=>x.id===chosen);if(!p||!draft.trim())return;p.last=Date.now();s.history.unshift({name:p.name,time:p.last,message:draft});save();draft="";encourage()}
function devotional(){let list=s.devotions.filter(x=>devTab==="all"||x.status===devTab);$("main").innerHTML='<div class="eyebrow">Prepare to share the Word</div><div class="row spread"><h1>Devotional</h1><button class="primary" onclick="editDev()">+ Devotion</button></div><div class="tabs">'+["all","draft","upcoming","delivered"].map(t=>'<button class="'+(t===devTab?'on':'')+'" onclick="devTab=\''+t+'\';devotional()">'+t[0].toUpperCase()+t.slice(1)+'</button>').join("")+'</div><input placeholder="Search title, passage or notes" oninput="filterCards(this.value)">'+(list.map(d=>'<div class="card entry"><small>'+esc(d.status)+' · '+esc(d.when||"No date")+'</small><h2>'+esc(d.title)+'</h2><p>'+esc(d.scripture)+'</p><div hidden>'+esc(d.notes)+'</div><div class="row"><button class="primary" onclick="present(\''+d.id+'\')">Present</button><button onclick="editDev(\''+d.id+'\')">Edit</button><button onclick="duplicate(\''+d.id+'\')">Duplicate</button></div></div>').join("")||'<div class="card muted">Your Sunday morning devotionals will appear here.</div>')}function editDev(id){let d=s.devotions.find(x=>x.id===id)||{};modal("Devotional notes",field("Title","dt",d.title)+field("Scripture","ds",d.scripture)+'<label>Delivery date<input type="date" id="dd" value="'+esc(d.when)+'"></label><label>Status<select id="dst">'+options(["draft","upcoming","delivered"],d.status)+'</select></label>'+field("Introduction","di",d.intro,true)+field("Main points / outline","dn",d.notes,true)+field("Application / conclusion","da",d.application,true)+'<button class="primary" onclick="saveDev(\''+(id||"")+'\')">Save</button>'+(id?'<button class="danger" onclick="remove(\'devotions\',\''+id+'\')">Delete</button>':''))}function saveDev(id){let title=$("dt").value.trim();if(!title)return;let d=s.devotions.find(x=>x.id===id);if(!d){d={id:uid(),created:Date.now()};s.devotions.unshift(d)}Object.assign(d,{title,scripture:$("ds").value,when:$("dd").value,status:$("dst").value,intro:$("di").value,notes:$("dn").value,application:$("da").value});close()}function duplicate(id){let d=s.devotions.find(x=>x.id===id);s.devotions.unshift({...d,id:uid(),title:d.title+" (copy)",status:"draft"});save();devotional()}function present(id){let d=s.devotions.find(x=>x.id===id);modal(d.title,'<p>'+esc(d.scripture)+'</p>'+[["Introduction",d.intro],["Outline",d.notes],["Application",d.application]].map(([k,v])=>'<details open><summary>'+k+'</summary><p class="notes big">'+esc(v)+'</p></details>').join("")+'<button onclick="let p=s.devotions.find(x=>x.id===\''+id+'\');p.status=\'delivered\';close()">Mark delivered</button>')}
function settings(){modal("Settings",'<label>Appearance<select onchange="s.theme=this.value;save();theme()">'+options(["system","light","dark"],s.theme)+'</select></label><label>Bible translation<select onchange="s.translation=this.value;save()"><option value="web" '+(s.translation==="web"?"selected":"")+'>World English Bible</option><option value="kjv" '+(s.translation==="kjv"?"selected":"")+'>King James Version</option></select></label><label>Reading font size<input type="range" min="16" max="32" value="'+s.font+'" oninput="s.font=+this.value;save()"></label><label>Daily reading goal (minutes)<input type="number" min="1" max="180" value="'+s.goal+'" onchange="s.goal=Math.max(1,+this.value);save()"></label><label>Journal categories (one per line)<textarea id="cats">'+esc(s.categories.join("\n"))+'</textarea></label><button onclick="s.categories=[...new Set($(&quot;cats&quot;).value.split(&quot;\\n&quot;).map(x=>x.trim()).filter(Boolean))];save()">Save categories</button><hr><p class="muted">Data stays on this device. Export regularly; clearing website data can erase it. Bible chapters are cached when loaded, subject to available storage.</p><button onclick="backup()">Export backup</button><label>Restore backup<input type="file" accept="application/json" onchange="restore(this.files[0])"></label><button class="primary" onclick="close()">Done</button>')}function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:"application/json"}));a.download="abide-backup-"+day()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(f){if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.prayers)||!Array.isArray(d.journal)||!Array.isArray(d.people)||!Array.isArray(d.devotions)||!d.read||!d.seconds)throw Error();if(confirm("Replace local data with this backup?")){s={...defaults(),...d};close()}}catch{alert("Invalid backup file")}}render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
